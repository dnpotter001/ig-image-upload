info:
  name: Me
  type: http
  seq: 1

http:
  method: GET
  url: https://graph.instagram.com/{{api_version}}/me
  params:
    - name: fields
      value: user_id,username
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
