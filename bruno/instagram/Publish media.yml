info:
  name: Publish media
  type: http
  seq: 4

http:
  method: POST
  url: https://graph.instagram.com/{{api_version}}/{{ig_user_id}}/media_publish
  body:
    type: json
    data: |-
      {
        "creation_id": "{{container_id}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
