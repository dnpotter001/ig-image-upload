info:
  name: Get container status
  type: http
  seq: 3

http:
  method: GET
  url: https://graph.instagram.com/{{api_version}}/{{container_id}}
  params:
    - name: fields
      value: status_code
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
