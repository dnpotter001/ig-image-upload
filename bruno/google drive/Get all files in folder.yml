info:
  name: Get all files in folder
  type: http
  seq: 4

http:
  method: GET
  url: https://www.googleapis.com/drive/v3/files
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
